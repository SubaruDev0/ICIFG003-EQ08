<app-header></app-header>

<div class="page-header">
  <h1>Nuestros Servicios</h1>
  <p>Tratamientos dentales de alta calidad directamente desde nuestra base de datos</p>
  <button *ngIf="isAdmin" class="btn-admin" (click)="irACrearServicio()">
    <i class="fas fa-plus-circle"></i> Agregar Servicio
  </button>
</div>

<main>

  <div *ngIf="cargando" class="estado-carga">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Cargando servicios...</p>
  </div>

  <div *ngIf="error" class="estado-error">
    <i class="fas fa-exclamation-triangle"></i>
    <p>{{ error }}</p>
  </div>

  <section *ngIf="!cargando && !error && servicios.length > 0" class="servicios-grid">
    <div class="servicio-card" *ngFor="let servicio of servicios" style="opacity:0">
      <img [src]="imgSrc(servicio.imagenBase64)" [alt]="servicio.nombre">
      <h3>{{ servicio.nombre }}</h3>
      <button class="btn-info" (click)="irAPedirTurno(servicio)">Pedir Turno</button>
    </div>
  </section>

  <div *ngIf="!cargando && !error && servicios.length === 0" class="estado-vacio">
    <i class="fas fa-tooth"></i>
    <p>No hay servicios registrados aún.</p>
    <button *ngIf="isAdmin" class="btn-admin" (click)="irACrearServicio()">
      Crear el primer servicio
    </button>
  </div>

</main>

<app-footer></app-footer>
<button class="btn-contacto" (click)="irAPedirTurno()">Pedir Turno</button>
