<div class="pantalla-inicial" *ngIf="pantallaVisible">
  <div class="expansor-azul"></div>
  <div class="contenedor-logo"
       [class.mostrar-logo]="logoEstado === 'mostrar'"
       [class.desvanecer]="logoEstado === 'desvanecer'"
       [class.ocultar-final]="logoEstado === 'final'">
    <img src="assets/img/logo.png" alt="Logo Clínica Dental" class="logo-clinica">
  </div>
</div>

<div class="contenedor-login" [class.visible]="loginVisible" [class.oculto]="!loginVisible">
  <div class="tarjeta-login">
    <div class="encabezado-login">
      <h2>¡Bienvenido!</h2>
    </div>

    <form class="formulario-login" (ngSubmit)="onSubmit()">
      <div class="grupo-entrada">
        <input type="text" id="nombreUsuario" [(ngModel)]="usuario" name="usuario" required>
        <label for="nombreUsuario"><i class="fas fa-user"></i> Usuario</label>
      </div>

      <div class="grupo-entrada">
        <input type="password" id="contrasena" [(ngModel)]="contrasena" name="contrasena" required>
        <label for="contrasena"><i class="fas fa-lock"></i> Contraseña</label>
      </div>

      <div class="opciones-login">
        <label class="recordarme cntr">
          <input type="checkbox" id="cbx-recordar" class="hidden-xs-up">
          <div class="cbx"></div>
          <span class="lbl">Recordarme</span>
        </label>
        <a href="#" class="olvide-contrasena">¿Olvidaste la contraseña?</a>
      </div>

      <div class="mensaje-error" *ngIf="mostrarError">{{ textoError }}</div>

      <button type="submit" class="boton-acceso">Acceder</button>
      <button type="button" class="boton-invitado" (click)="accederInvitado()">Acceder como invitado</button>
    </form>
  </div>
</div>
